name: Build DSHA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Android SDK and NDK 26
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "ndk;26.3.11579264"
          "$SDKMANAGER" "platforms;android-37" || true

      - name: Restore pinned offline inputs (Ubuntu rootfs & DSH runtime)
        run: |
          python3 tools/ci-assets.py \
            --url "$(python3 -c 'import json;print(json.load(open("ci/sunset-inputs.lock.json"))["url"])')" \
            --sha256 "$(python3 -c 'import json;print(json.load(open("ci/sunset-inputs.lock.json"))["sha256"])')"

      - name: Build Standard Release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleStandardRelease -x verifyPublishCertificate

      - name: Sign APK for direct Android install
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASS }}
        run: |
          RAW_APK=$(find app/build/outputs/apk/standard/release -name "*.apk" | head -n 1)
          echo "Found APK: $RAW_APK"

          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            KS_PASS="$KEYSTORE_PASS"
            K_ALIAS="$KEY_ALIAS"
            K_PASS="$KEY_PASS"
          else
            KS_PASS="dsha123456"
            K_ALIAS="dsha"
            K_PASS="dsha123456"
            keytool -genkeypair -v -keystore release.jks -storetype PKCS12 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias "$K_ALIAS" -storepass "$KS_PASS" -keypass "$K_PASS" \
              -dname "CN=DSHA Personal, OU=Personal, O=Personal, L=Local, S=Local, C=ID"
          fi

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$RAW_APK" dsha-aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.jks \
            --ks-pass "pass:$KS_PASS" \
            --ks-key-alias "$K_ALIAS" \
            --key-pass "pass:$K_PASS" \
            --out dsha-signed.apk \
            dsha-aligned.apk
          "$BUILD_TOOLS/apksigner" verify --verbose dsha-signed.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: dsha-self-built-apk
          path: dsha-signed.apk
          retention-days: 7
